    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

    <!-- Matches the app's --paper background, so there is no white flash
         before the stylesheet finishes loading -->
    <style>
      html, body { background: #F1ECDC; margin: 0; }
    </style>
